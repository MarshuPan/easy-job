name: Release

# 打 tag 才发布。tag 名要和 package.json 的 version 对得上（例如 v1.0.0 对 1.0.0），
# 对不上就直接失败——Release 页面上的版本号和用户装到的版本号不一致，
# 出问题时没人说得清对方用的是哪一版。v1.0.0-rc1 这类预发布后缀允许存在。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'

      # packageManager in package.json pins the pnpm version.
      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      # 预发布后缀是允许的：v1.1.4-rc1 对 1.1.4 算通过，用来在不动正式版本号的
      # 前提下验证这条流水线本身。带后缀的会被标成 prerelease，不占 Latest。
      - name: Check tag matches package version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          BASE="${TAG%%-*}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$BASE" != "$PKG" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
          if [ "$TAG" != "$BASE" ]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi

      # 发布前跑一遍完整门禁。构建能过不代表行为没坏，
      # 而 Release 一旦发出去就会被人下载安装。
      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm fmt:check

      - name: Test
        run: pnpm test

      # zip 会顺带产出 .output/<browser>-mv3，所以打包和校验共用同一次构建。
      - name: Build and package
        run: pnpm zip

      # 三个目标的 manifest 形状不同（Chromium 是 service worker，Firefox 是
      # event page），且 optional_host_permissions 在转换中丢失时不会报错，
      # 只在真机上表现为 AI 功能不可用。发布前逐个校验。
      - name: Validate all targets
        run: pnpm validate

      # 按 commit SHA 固定，不用 tag。这一步持有 contents: write，
      # 而 tag 是可变的——上游被入侵并把 v2 重指到别处，这里就会拿着写权限
      # 去跑别人的代码。SHA 对应 v2。
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # 不传 name 的话建出来的是无标题 Release，GitHub 会把标题位留空、
          # 只剩一个 tag 链接，看起来跟「只打了个 tag」没区别。
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            .output/*-chrome.zip
            .output/*-edge.zip
            .output/*-firefox.zip
          generate_release_notes: true
