name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'

      # packageManager in package.json pins the pnpm version.
      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm fmt:check

      - name: Test
        run: pnpm test

      # Builds all three targets and runs the manifest/asset validator on each.
      # Chrome-only would not catch Firefox regressions: its manifest has a
      # different background shape and drops keys the Chromium build keeps.
      - name: Build
        run: pnpm build
